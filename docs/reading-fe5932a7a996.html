<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：叙事分支必须有条件与结果</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：叙事分支必须有条件与结果</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>叙事分支必须有条件与结果</h2><pre>
先写一个两选项的小片段：玩家知道什么、能选什么、选择改变哪个状态、后续哪里使用这个状态。例如救不救商人改变信任值，下一次见面读取它决定对话；不要只写两段不同台词却声称有系统性后果。

用表写“前置条件—选项—状态变化—可见结果”，检查每个分支是否可达、是否有回到主循环或结束的路径。AI可以帮忙补台词和查漏，分支规则由你实际走通。先验证两个选择再扩展，避免剧情树无限增长。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
