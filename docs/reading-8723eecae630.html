<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：素材一致性与版本交接</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：素材一致性与版本交接</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>素材一致性与版本交接</h2><pre>
先为当前一种素材定规格：尺寸、透明背景、命名、动画帧数或音频时长、来源许可、在工程中的使用位置。生成一张或一个声音导入验证，成功后才批量做。风格描述不是规格，实际能否显示和播放也必须检查。

每次交接写清源文件、处理后文件、导入设置、当前使用版本与许可。不能确认授权的资源先替换为占位素材。与AI协作时给一张可用样本和明确约束，再比较新素材；不要把几十个没有检查的文件一股脑放进工程。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
