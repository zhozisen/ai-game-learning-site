<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：概念 7：冲突（conflict）——撞车了怎么办</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：概念 7：冲突（conflict）——撞车了怎么办</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>概念 7：冲突（conflict）——撞车了怎么办</h2><pre>
你和同学改了同一个文件的同一行，合并时 Git 无法自动裁决，就报告&quot;冲突&quot;，把两段代码都摆出来让你选。

⚠️ 这不是 bug，这是 Git 在保护你们——**它绝不会自作主张覆盖任何人的代码。冲突不是事故，是 Git 尽职尽责的报警。**
