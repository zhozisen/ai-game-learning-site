<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：界面布局与键盘焦点分开验证</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：界面布局与键盘焦点分开验证</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>界面布局与键盘焦点分开验证</h2><pre>
容器解决控件在不同宽度下怎样排列，焦点解决按键交给哪个控件。先用一个标题、两个按钮做界面，在窄窗口检查文字不截断、按钮仍能点击；不要一开始手动固定所有坐标。

接着只用键盘：Tab能否到达操作；Enter能否确认；关闭弹窗后是否回到合理位置；游戏结束时焦点是否落到重开按钮。布局正确不等于焦点正确。换条件检查长标题、320px窄屏和鼠标离开三种情况；只补当前出现的故障，不先搭复杂UI系统。
