<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：关卡与数值先做小对照</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：关卡与数值先做小对照</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>关卡与数值先做小对照</h2><pre>
关卡练习先只验证一个规则：让玩家先安全看见障碍，再用刚学会的操作通过，随后稍微改变距离或顺序。记录他在哪里停下、误解了什么；不要用“我觉得难度合适”代替观察。

数值练习一次改一个变量，例如移动速度或出现间隔。先写预测，再在同一条件下比较两个值，记录完成时间、失败位置或其他与目标直接相关的结果。成长曲线至少说明起点、增长与上限，防止奖励过快或永远追不上目标。Resource能保存数字，但不会自动替你决定合理数字。
