<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：比较模型时固定同一任务</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：比较模型时固定同一任务</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>比较模型时固定同一任务</h2><pre>
用同一份目标、上下文、允许改动范围和验收步骤比较两个工具或模型。先规定成功标准，例如功能实际可用、改动范围可审、没有额外依赖，再分别独立执行；不要把第一份答案贴给第二个以后称作公平对照。

记录实际运行结果、需要补充提示的次数、等待和花费；没有的数值不编造。选适合当前任务的方案，不用一次实验推断所有能力。若两者都过不了检查，先审查任务和环境，不只追求更换模型。
