<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：一个音效进入游戏</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：一个音效进入游戏</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>一个音效进入游戏</h2><pre>
1. 记录授权，复制到assets/audio，添加AudioStreamPlayer并指定音频流。
2. 用已有的一个明确事件触发播放，先只做一次，不同时搭整套音频管理。
3. 听声音是否清晰、响度是否突变、一次事件是否重复播放；检查音量/静音在实际导出平台是否有效。
4. 需要循环BGM时另查导入与循环选项，完整听一个接缝再记录结果。
