<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：用同一架构方法处理生活任务</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：用同一架构方法处理生活任务</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>用同一架构方法处理生活任务</h2><pre>
以复习计划为例：输入是课程要求与错题，处理是按缺口分组并选当日任务，输出是一份可检查的小练习结果；反馈是哪些错误仍然存在。学生自己决定目标与时间，AI可以整理错题、给提示，但结果要由实际练习证明。

明确数据放在哪里、谁负责更新、失败怎样处理，例如没完成时调整任务量而不是自动伪造打卡。先人工跑一轮，再判断哪一环值得自动化。生活系统同样需要输入、职责、接口、反馈和边界，不必照搬Godot节点或写成软件。
