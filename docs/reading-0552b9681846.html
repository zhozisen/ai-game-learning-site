<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：问题卡与看板的最小用法</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：问题卡与看板的最小用法</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>问题卡与看板的最小用法</h2><pre>
问题卡写目标或现象、预期、复现步骤、版本与完成条件。修复卡不能只写“游戏坏了”，例如“v0.2结束后按重开，分数没有归零，预期为0”。开卡后先确认能否复现，再安排处理。

需要同时跟踪多项任务时，再使用Projects把这些已有Issue放到待做、进行中、已完成。完成列表示已按验收核对，不表示“AI说改完了”。本节先维护一张卡的状态流转；看板入口和配置通过官方Issues文档中的Projects链接查阅，不再平行维护另一份重复清单。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
