<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：演示视频让人看懂玩法</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：演示视频让人看懂玩法</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>演示视频让人看懂玩法</h2><pre>
先写三个镜头：怎样操作；操作产生什么反馈；目标或结束是什么。每个镜头从当前可玩版本录制，不用未来构想和生成画面冒充已实现功能。先录十几秒的粗版，不急着做片头和特效。

让没玩过的同学看一次，再请他复述操作和目标；讲不清就删掉无关画面、补关键反馈或加短字幕。截图优先展示实际交互和清晰界面。视频、封面和可玩网址标记同一个版本，游戏改了以后重新核对说明。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
