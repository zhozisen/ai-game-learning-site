<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：卡住的处理顺序</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：卡住的处理顺序</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>卡住的处理顺序</h2><pre>
停止加功能 → 保存当前状态 → 确认能否重复 → 读报错的文件和行号 → 比较最近一次改动 → 做最小修复 → 原步骤复验。语法/节点引用回第2站，输入输出不清回第3站，玩法目的不清回第5站。仍解决不了，把版本、复现、预期/实际、完整报错和已尝试方法交给教师。

教师检查：能解释、能运行、能验证则通过；缺哪项就只补哪项。暂没有站内自动工程批改，不把答题和任务点当工程能力证明。
</pre></section><p><a href="79c2fd364a90.html">按需查看完整原稿</a></p></html>
