<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：四句话限定自己的首作</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：四句话限定自己的首作</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>四句话限定自己的首作</h2><pre>
先写四句：玩家反复做什么；什么结果表示做得好；什么时候结束；怎样重新开始。例如：左右移动篮子接光点；接到一次加一分；漏掉三次结束；点重开后分数和漏接数归零。核心操作也可以是点击、拖放或选择，不需要强行做成接物游戏。

再写一项第一版不做的内容，例如联机、商店或多结局。判断标准是：删掉它以后，上面四句能否成立？能成立，就先删。请同学只看这四句复述一次；如果他还不知道怎样操作或怎样结束，先把句子补清楚，再增加功能。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
