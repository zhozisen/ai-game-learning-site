<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：文案与无障碍的最小检查</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：文案与无障碍的最小检查</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>文案与无障碍的最小检查</h2><pre>
文案先回答玩家此刻需要知道什么：目标、操作、失败原因和下一步。用一句短提示替换长段世界观，请第一次接触的人复述并操作。叙事只在项目确实需要时扩展。

无障碍先消除当前障碍：重要状态不只靠颜色区分，文字在背景上可辨，音量可调或能静音，按钮和必要操作可到达。分别用关闭声音、不同窗口宽度、只用键盘来检查。不是要求首作实现所有辅助选项，而是明确当前目标人群能否完成核心循环以及尚未支持什么。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
