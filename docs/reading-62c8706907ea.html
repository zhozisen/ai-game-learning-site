<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：用历史定位一次退化</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：用历史定位一次退化</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>用历史定位一次退化</h2><pre>
先写固定复现条件，例如“按一次重开后捡一枚物品”。找到最近一次能正确运行的提交和第一次确认错误的提交，在独立副本比较这段历史的差异；保持输入和测试步骤一致，否则无法判断修复来自哪里。

记录怀疑的变化、验证依据和最终修复提交。历史很多时可以逐步缩小区间；自动bisect适合已有稳定判定步骤时再查，不需要为了本任务学完全部Git排错命令。没有提交过的变化不在这条历史中。

</pre></section><p><a href="61d0d8de750c.html">按需查看完整原稿</a></p></html>
