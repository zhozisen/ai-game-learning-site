<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配套讲解：一张图片进入游戏</title><style>body{background:#101010;color:#ddd;max-width:850px;margin:30px auto;padding:20px;font:16px/1.9 sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}a{color:#eee}section{scroll-margin-top:24px}h1{font-size:25px}h2{font-size:20px}</style><h1>配套讲解：一张图片进入游戏</h1><p>本页只摘取当前任务指定的本站讲义章节，按页面顺序阅读；不要求读完整原稿。</p><section id="section-0"><h2>一张图片进入游戏</h2><pre>
1. 选有明确许可的一张图片，记录来源与用途，复制到工程assets/art。
2. 在文件系统中确认导入，再赋给一个Sprite2D的纹理；在检查器中观察尺寸、位置和缩放。
3. 运行，检查透明边缘、清晰度、与其他对象比例及遮挡；可见图片和碰撞形状是两回事，分别核对。
4. 对照素材规格修正，记录实际显示效果；成功后再替换其余图片。需要调整过滤或压缩时先查本机版本设置。

</pre></section><p><a href="79c2fd364a90.html">按需查看完整原稿</a></p></html>
